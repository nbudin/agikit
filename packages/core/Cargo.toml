[package]
name = "agikit-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitfield-struct = "0.11.0"
nodejs-sys = "0.15.0"
pretty_assertions = "1.4.1"
serde = "1.0.219"
tsify = { version = "0.5.5", features = ["js"] }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["console"] }

[profile.release]
opt-level = "s"
lto = true
