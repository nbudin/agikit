[package]
name = "agikit-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitfield-struct = "0.11.0"
include_dir = "0.7.4"
nodejs-sys = "0.15.0"
peg = "0.8.5"
serde = "1.0.219"
serde_json = "1.0.140"
serde_repr = "0.1.20"
strum = "0.27.1"
strum_macros = "0.27.1"
tsify = { version = "0.5.5", features = ["js"] }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["console"] }
logic_command_macros = { path = "../logic_command_macros" }
picture_pen_macros = { path = "../picture_pen_macros" }
petgraph = "0.8.2"
anyhow = "1.0.98"
num_enum = "0.7.4"
bitstream-io = "4.5.0"
serde_with = { version = "3.14.0", features = ["base64"] }
log = "0.4.28"

[dev-dependencies]
image = "0.25.6"
similar-asserts = "1.7.0"

[features]
default = ["js", "dot"]
dot = []
js = []
peg-trace = ["peg/trace"]

[profile.release]
opt-level = "s"
lto = true
